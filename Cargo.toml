[workspace]
members = [
    "crates/backend",
    "crates/cli",
    "crates/frontend",
    "crates/types",
    "crates/utils",
    "crates/migration",
]
resolver = "2"

[workspace.package]
version = "0.12.9"
license = "BSD-3-Clause"
authors = ["hikari <me@metantesan.com>"]
edition = "2024"
repository = "https://github.com/metantesan/mitsuzo"

[workspace.dependencies]
mitsuzo-types = { path = "crates/types" }
mitsuzo-utils = { path = "crates/utils" }
cli = { path = "crates/cli" }

argon2 = "0.6"
sha2 = "0.11.0"
base64 = "0.23"
bitcode = { version = "0.6.7", features = ["serde"] }
orion = "0.18"
getrandom = { version = "0.4", features = ["wasm_js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dioxus = { version = "0.7", features = ["router", "web"] }
log = "0.4"
wasm-logger = "0.2.0"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Blob",
    "File",
    "Url",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "HtmlScriptElement",
    "BlobPropertyBag",
    "XmlHttpRequest",
    "XmlHttpRequestUpload",
    "ProgressEvent",
    "FileReader",
    "Storage",
    "XmlHttpRequestResponseType",
] }
gloo-file = { version = "0.4.0", features = ["futures"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
futures = "0.3"
wasm-bindgen-futures = "0.4"
dioxus-i18n = "0.5"
unic-langid = { version = "0.9", features = ["macros"] }

clap = { version = "4", features = ["derive"] }
dirs = "7.0.0"
reqwest = "0.13"
rpassword = "7.5.4"
serde_yaml = "0.9.34"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rand = "0.10"
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "fs"] }
sled = "0.34.7"
sea-orm = { version = "2", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
async-trait = "0.1"
zeroize = { version = "1", features = ["zeroize_derive"] }
eyre = "0.6"
color-eyre = "0.6"

indicatif = "0.18.6"
colored = "3.0.0"

mermaid-rs-renderer = { version = "0.3", default-features = false }

x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
bip39 = { version = "2", default-features = false, features = ["std"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = 0
strip = "symbols"
panic = "abort"
